<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Elastos Node Manager</title>
    <link rel="stylesheet" href="css/styles.css?ts=20260513c">
    <script>
        // Apply theme BEFORE first paint to avoid a flash.
        //   - mode='manual' → use the operator's last manual choice
        //     stored in 'elacity-theme'
        //   - mode='auto' (default) → fall back to the last broadcast
        //     value cached in 'elacity-theme' (set by services/theme.js
        //     when PC2's themeChanged broadcast arrives), or to the OS
        //     prefers-color-scheme as a last resort
        // Either way, services/theme.js will replace this with PC2's
        // current value as soon as the broadcast arrives.
        (function () {
            try {
                var mode = localStorage.getItem('enm-theme-mode') || 'auto';
                var saved = localStorage.getItem('elacity-theme');
                var prefersDark = window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = (mode === 'manual')
                    ? (saved === 'dark')
                    : (saved === 'dark' || (!saved && prefersDark));
                if (dark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* localStorage may be blocked; ignore */ }
        })();

        // alpha.25 — set initial body[data-app-size] before first paint so CSS
        // rules apply without a layout flash. JS later wires a ResizeObserver
        // for dynamic updates as the iframe resizes.
        //
        // We use window.innerWidth — inside an iframe this returns the
        // iframe's interior width (NOT the outer browser viewport). The
        // @media (max-width: X) queries in CSS are broken in iframes because
        // they measure the outer viewport; this attribute is iframe-correct.
        (function () {
            try {
                var w = window.innerWidth || document.documentElement.clientWidth || 1200;
                var size = w < 700 ? 'narrow' : (w < 1000 ? 'medium' : 'wide');
                // body doesn't exist yet at this point, so stash on documentElement
                // and the body version is set in a second script after </body>.
                document.documentElement.dataset.appSize = size;
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <!-- a11y: skip link lands at the top of the Tab order so keyboard
         users can jump past the chrome (gear, theme, 5 tabs). Visible
         only on focus (see .enm-skip-link in styles.css). -->
    <a href="#enm-main" class="enm-skip-link">Skip to main content</a>
    <div id="app" class="enm-app" data-state="connecting">
        <!-- a11y: WCAG 2.4.6 requires a top-level heading. The PC2 window
             chrome shows the app name in its title bar, but screen-reader
             users navigating by heading need an h1 inside the document. -->
        <h1 class="enm-sr-only">Elastos Node Manager</h1>
        <!-- Header bar matching dao-dashboard's pattern: tabs on the left,
             flexible spacer, global controls on the right. PC2's window
             manager already provides the app title via window-head — no
             need to re-render it here. -->
        <nav class="enm-header-bar" id="enm-tabs" role="tablist" aria-label="Sections" hidden>
            <div class="enm-header-tabs">
                <button type="button" class="enm-tab active" role="tab" id="enm-tab-dashboard" data-tab="dashboard" aria-selected="true"  aria-controls="enm-pane-dashboard" tabindex="0">Dashboard</button>
                <button type="button" class="enm-tab"        role="tab" id="enm-tab-logs"      data-tab="logs"      aria-selected="false" aria-controls="enm-pane-logs"      tabindex="-1">Logs</button>
                <button type="button" class="enm-tab"        role="tab" id="enm-tab-settings"  data-tab="settings"  aria-selected="false" aria-controls="enm-pane-settings"  tabindex="-1">Settings</button>
                <button type="button" class="enm-tab"        role="tab" id="enm-tab-audit"     data-tab="audit"     aria-selected="false" aria-controls="enm-pane-audit"     tabindex="-1">Audit</button>
                <button type="button" class="enm-tab"        role="tab" id="enm-tab-evm"       data-tab="evm"       aria-selected="false" aria-controls="enm-pane-evm"       tabindex="-1">
                    EVM <span class="enm-tab-pill">v0.5</span>
                </button>
            </div>
            <div class="enm-header-spacer"></div>
            <div class="enm-header-actions">
                <!-- Theme toggle moved into the settings drawer in v0.4 P5C —
                     this stays as a fallback for the error pane / pre-drawer
                     boot states. Hidden in home mode (the gear opens the
                     drawer where the operator can switch theme). -->
                <button type="button" class="enm-icon-btn" id="enm-theme-toggle" title="Toggle dark mode" aria-label="Toggle theme" hidden>
                    <svg class="enm-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg class="enm-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>
                </button>
                <button type="button" class="enm-icon-btn" id="enm-settings-toggle" title="Settings" aria-label="Open settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <main class="enm-main" id="enm-main">
            <!-- a11y: role="status" implies aria-live="polite"; pairing them
                 caused Safari + older NVDA to double-announce the spinner. -->
            <div class="enm-spinner" id="enm-spinner" role="status">
                <div class="enm-spinner-dots">
                    <div class="enm-spinner-dot"></div>
                    <div class="enm-spinner-dot"></div>
                    <div class="enm-spinner-dot"></div>
                </div>
                <p class="enm-spinner-text" id="enm-spinner-text">Connecting to Node Manager...</p>
            </div>

            <section class="enm-content" id="enm-content" hidden>
                <div class="enm-pane" id="enm-pane-dashboard" role="tabpanel" aria-labelledby="enm-tab-dashboard" tabindex="0"></div>
                <div class="enm-pane" id="enm-pane-logs"      role="tabpanel" aria-labelledby="enm-tab-logs"      tabindex="0" hidden></div>
                <div class="enm-pane" id="enm-pane-settings"  role="tabpanel" aria-labelledby="enm-tab-settings"  tabindex="0" hidden></div>
                <div class="enm-pane" id="enm-pane-audit"     role="tabpanel" aria-labelledby="enm-tab-audit"     tabindex="0" hidden></div>
                <div class="enm-pane" id="enm-pane-evm"       role="tabpanel" aria-labelledby="enm-tab-evm"       tabindex="0" hidden></div>
            </section>

            <div class="enm-error" id="enm-error" hidden role="alert">
                <div class="enm-error-title" id="enm-error-title"></div>
                <div class="enm-error-detail" id="enm-error-detail"></div>
            </div>
        </main>
    </div>

    <!-- Order matters: strings + utils first (used by services + components),
         then services, then components, then the app controller. -->
    <script src="js/strings.js?ts=20260512c"></script>
    <script src="js/utils.js?ts=20260506g"></script>
    <script src="js/illustrations.js?ts=20260506g"></script>
    <script src="js/services/wallet.js?ts=20260506g"></script>

    <script src="js/services/sse.js?ts=20260511d"></script>

    <script src="js/services/fleet-health-gradient.js?ts=20260512a"></script>
    <script src="js/services/height-series.js?ts=20260512a"></script>
    <script src="js/components/system-status.js?ts=20260511f"></script>
    <script src="js/components/sparkline.js?ts=20260512a"></script>
    <script src="js/components/power-circle.js?ts=20260512a"></script>
    <script src="js/components/chain-card.js?ts=20260512e"></script>
    <script src="js/components/validator-registration-card.js?ts=20260511e"></script>
    <script src="js/components/producer-identity.js?ts=20260512a"></script>
    <script src="js/components/log-viewer.js?ts=20260507d"></script>
    <script src="js/components/proposal-card.js?ts=20260506g"></script>
    <script src="js/components/welcome-screen.js?ts=20260506g"></script>
    <script src="js/components/setup-conversation.js?ts=20260511c"></script>
    <script src="js/components/settings-tab.js?ts=20260511g"></script>
    <script src="js/components/audit-tab.js?ts=20260506g"></script>
    <script src="js/components/evm-tab.js?ts=20260506g"></script>
    <script src="js/components/settings-drawer.js?ts=20260506g"></script>
    <script src="js/components/tools-update-card.js?ts=20260512c"></script>
    <script src="js/components/technical-view.js?ts=20260512f"></script>
    <script src="js/app.js?ts=20260513a"></script>
</body>
</html>

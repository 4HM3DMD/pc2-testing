<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover lets safe-area-inset-* paddings honour iPhone
         notches in landscape; interactive-widget=resizes-content tells
         iOS to shrink the layout viewport when the soft keyboard opens
         so Save/Continue buttons aren't covered by it. user-scalable
         intentionally omitted so WCAG 1.4.4 (200% zoom) is allowed. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
    <meta name="referrer" content="no-referrer">
    <title>Elastos Node Manager</title>
    <link rel="stylesheet" href="css/styles.css?ts=20260520v168">
    <script>
        // Beta 3 — Phase 1c carried over. Dark-only. We hard-code data-theme=dark
        // on documentElement so any rule that still says [data-theme="dark"] keeps
        // matching even though the toggle is gone.
        (function () {
            try { document.documentElement.setAttribute('data-theme', 'dark'); }
            catch (e) { /* :root dark values still apply */ }
        })();

        // alpha.25 → Beta 3 — pre-paint data-app-size detection.
        // window.innerWidth inside iframes returns the iframe's interior
        // width (NOT the outer browser viewport), which is what we want.
        // Phase-02 mock spec: wide >=700px, narrow 480-699px, compact <480px.
        (function () {
            try {
                var w = window.innerWidth || document.documentElement.clientWidth || 1200;
                var size = w < 480 ? 'compact' : (w < 700 ? 'narrow' : 'wide');
                document.documentElement.dataset.appSize = size;
                window.__enmInitialWidth = w;
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <!-- alpha.28.1 batch 88 — mirror html[data-app-size] to body the
         instant body opens, before any defer scripts run. The CSS at
         body[data-app-size="..."] needs this to match on first paint. -->
    <script>
        (function () {
            try {
                var sz = document.documentElement.dataset.appSize;
                if (sz) { document.body.dataset.appSize = sz; }
            } catch (e) { /* app.js will mirror on first run */ }
        })();
    </script>

    <!-- a11y: skip link lands at the top of the Tab order so keyboard
         users can jump past the chrome (brand, tabs, gear). Visible
         only on focus (see .enm-skip-link in styles.css). -->
    <a href="#enm-main" class="enm-skip-link">Skip to main content</a>

    <!-- BP-A — Reusable SVG defs referenced by the chain-card hero.
         #enm-power-icon: the power symbol inside .enm-hero-power.
         #enm-sync-grad:  cyan→blue linear gradient for the .enm-hero-sync
                          progress ring. Both defined ONCE here so every
                          mounted chain-card can `<use href="#..."/>`. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="enm-power-icon" viewBox="0 0 24 24">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <line x1="12" y1="3" x2="12" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </symbol>
            <linearGradient id="enm-sync-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00d4ff"/>
                <stop offset="100%" stop-color="#5b8fff"/>
            </linearGradient>
        </defs>
    </svg>

    <!--
        Beta 3 app shell. Reference: enm-design-mocks/v2/phase-02-chrome.html.

        Structure (post-beta.3.74 — gear icon dropped per operator
        callout: was redundant with the Settings tab):
            .enm-app[data-active-tab="..."]
              .enm-topbar
                .enm-chain-selector (was .enm-brand pre-3.70)
                .enm-tabs           (role=tablist, horizontal scroll)
              .enm-main             (pane container)

        EVM tab is dropped — Beta 3 is mainchain-only per directive.
        Council node UI is deferred. The five tabs from alpha.27 become
        four (Dashboard / Logs / Settings / Audit).
    -->
    <div class="enm-app" id="app" data-active-tab="dashboard">
        <!-- a11y: WCAG 2.4.6 needs a top-level heading. PC2 chrome shows
             the app name in its title bar but AT users navigating by
             heading need an h1 inside the document. -->
        <h1 class="enm-sr-only">Elastos Node Manager</h1>

        <header class="enm-topbar" role="banner">
            <!-- beta.3.70 — brand-mark + brand-name removed. PC2's
                 window chrome already shows the app icon + name in
                 the title bar above; duplicating them inside the
                 iframe was wasted header space. Operator pointed at
                 this explicitly: "the top label says it why duplicate".

                 What replaces them: a chain selector. Detection:

                   cfg.chains count = 1 (mainchain only)
                     → BPoS-only operator → selector renders but
                       only Main chain is enabled; others grayed
                       with hover tooltip + footer note.
                   cfg.chains count >= 2
                     → council operator → all configured chains
                       enabled, others stay grayed until installed.

                 The selector lists all 7 known chain surfaces
                 (Multi-chain overview / Main chain / ESC + Oracle
                 / EID + Oracle / PG + Oracle / Arbiter / SPV) so
                 the operator sees the full landscape; available
                 ones light up, unavailable ones explain why.
                 Selection persists per operator in localStorage. -->
            <div class="enm-chain-selector" id="enm-chain-selector"
                 data-mode="bpos-only" data-active="mainchain">
                <button type="button" class="enm-chain-selector-trigger"
                        id="enm-chain-selector-trigger"
                        aria-haspopup="listbox" aria-expanded="false"
                        aria-label="Chain view selector">
                    <span class="enm-chain-selector-label" id="enm-chain-selector-label">Main chain</span>
                    <span class="enm-chain-selector-caret" aria-hidden="true">▾</span>
                </button>
                <div class="enm-chain-selector-menu" id="enm-chain-selector-menu"
                     role="listbox" aria-labelledby="enm-chain-selector-trigger" hidden>
                    <!-- Options populated by js/components/chain-selector.js
                         on first activation so the static markup stays
                         identity-only and we can iterate the option set
                         from one place. -->
                </div>
            </div>
            <nav class="enm-tabs" id="enm-tabs" role="tablist" aria-label="Sections" hidden>
                <button type="button" class="enm-tab active" role="tab" id="enm-tab-dashboard" data-tab="dashboard" aria-selected="true"  aria-controls="enm-pane-dashboard" tabindex="0">Dashboard</button>
                <button type="button" class="enm-tab"        role="tab" id="enm-tab-logs"      data-tab="logs"      aria-selected="false" aria-controls="enm-pane-logs"      tabindex="-1">Logs</button>
                <button type="button" class="enm-tab"        role="tab" id="enm-tab-settings"  data-tab="settings"  aria-selected="false" aria-controls="enm-pane-settings"  tabindex="-1">Settings</button>
                <button type="button" class="enm-tab"        role="tab" id="enm-tab-audit"     data-tab="audit"     aria-selected="false" aria-controls="enm-pane-audit"     tabindex="-1">Activity</button>
            </nav>
            <!-- beta.3.74 — the gear icon was removed. Per the operator's
                 callout in 3.73 review: "the settings toggle and settings
                 button do the same thing, we don't want both on all
                 screens". js/app.js#_wireSettingsToggle wired the gear
                 to programmatically click the Settings tab — pure
                 redundancy. The Settings tab is the canonical entry and
                 is always visible in the tabs strip, so the gear ate
                 valuable topbar width (especially in the new compact
                 2-row grid layout) for no behaviour the tab didn't
                 already provide. _wireSettingsToggle stays in app.js
                 as a no-op because its first line is a getElementById
                 guard; if a future settings-drawer overlay returns the
                 gear can come back. -->
        </header>

        <main class="enm-main" id="enm-main">
            <!-- Spinner: a11y role=status implies aria-live=polite; pairing them
                 caused Safari + older NVDA to double-announce in alpha. -->
            <div class="enm-spinner" id="enm-spinner" role="status">
                <div class="enm-spinner-dots">
                    <div class="enm-spinner-dot"></div>
                    <div class="enm-spinner-dot"></div>
                    <div class="enm-spinner-dot"></div>
                </div>
                <p class="enm-spinner-text" id="enm-spinner-text">Connecting to Node Manager…</p>
            </div>

            <section class="enm-content" id="enm-content" hidden>
                <div class="enm-pane" id="enm-pane-dashboard" role="tabpanel" aria-labelledby="enm-tab-dashboard" tabindex="0"></div>
                <div class="enm-pane" id="enm-pane-logs"      role="tabpanel" aria-labelledby="enm-tab-logs"      tabindex="0" hidden></div>
                <div class="enm-pane" id="enm-pane-settings"  role="tabpanel" aria-labelledby="enm-tab-settings"  tabindex="0" hidden></div>
                <div class="enm-pane" id="enm-pane-audit"     role="tabpanel" aria-labelledby="enm-tab-audit"     tabindex="0" hidden></div>
            </section>

            <div class="enm-error" id="enm-error" hidden role="alert">
                <div class="enm-error-title" id="enm-error-title"></div>
                <div class="enm-error-detail" id="enm-error-detail"></div>
                <div class="enm-error-actions">
                    <button type="button" class="enm-btn enm-btn-primary" id="enm-error-retry">Retry</button>
                    <button type="button" class="enm-btn enm-btn-secondary" id="enm-error-reload">Reload page</button>
                </div>
            </div>
        </main>
    </div>

    <!--
        Script load order:
        strings + utils → services → components → app controller.
        `defer` preserves execution order while letting all scripts
        download in parallel.

        Beta 3 keeps every alpha.29 service + component module. The
        component files will be reshaped in B3.2-5 to emit the new
        mock-derived markup; their JS contracts (event listeners,
        lifecycle guards, ARIA wiring) stay intact.
    -->
    <script defer src="js/strings.js?ts=20260520v168"></script>
    <script defer src="js/utils.js?ts=20260506g"></script>
    <script defer src="js/illustrations.js?ts=20260506g"></script>
    <script defer src="js/services/wallet.js?ts=20260506g"></script>
    <script defer src="js/services/api.js?ts=20260506g"></script>
    <script defer src="js/services/sse.js?ts=20260511d"></script>
    <script defer src="js/services/notifications.js?ts=20260515b3e"></script>
    <!-- alpha.29 batch 97 — shared screen-reader announcer -->
    <script defer src="js/services/announcer.js?ts=20260514a"></script>
    <!-- alpha.29 batch 98 — offline + recovery banner -->
    <script defer src="js/services/online-watcher.js?ts=20260514a"></script>
    <script defer src="js/services/fleet-health-gradient.js?ts=20260512a"></script>
    <script defer src="js/services/height-series.js?ts=20260512a"></script>
    <script defer src="js/components/chain-selector.js?ts=20260520v168"></script>
    <script defer src="js/components/system-status.js?ts=20260515b3s"></script>
    <script defer src="js/components/sparkline.js?ts=20260512a"></script>
    <script defer src="js/components/power-circle.js?ts=20260512a"></script>
    <script defer src="js/components/chain-card.js?ts=20260520v168"></script>
    <script defer src="js/components/validator-registration-card.js?ts=20260515b3t"></script>
    <!-- beta.3.14 — always-on node-identity card. Truth-corrected from beta.3.13:
         the keystore-derived address is the consensus signing identity ONLY;
         block rewards go to the OwnerPublicKey-derived stake address (the
         Essentials wallet that registered the producer). Operator-login wallet
         row dropped.
         beta.3.15 — bumped to ?ts=20260515b3s (drops balance line + dead
         deposit/rewards stat). -->
    <script defer src="js/components/node-identity-card.js?ts=20260515b3t"></script>
    <!-- beta.3.15 — producer-identity.js dropped. Component was loaded by the
         old technical-view but never mounted on the Beta 3 dashboard. Its
         CR Council / DID copy violated the "no Council content on dashboard"
         operator rule, and the entire card was dead bytes in the bundle. -->
    <!-- <script defer src="js/components/producer-identity.js"></script> -->

    <script defer src="js/components/log-viewer.js?ts=20260515b3u"></script>
    <script defer src="js/components/proposal-card.js?ts=20260515b3f"></script>
    <script defer src="js/components/welcome-screen.js?ts=20260515b3e"></script>
    <script defer src="js/components/setup-conversation.js?ts=20260515b3o"></script>
    <script defer src="js/components/settings-tab.js?ts=20260518b378a"></script>
    <!-- alpha.29 batch 103 — audit-tab lazy-loaded via enmLoadScript when
         the Audit tab first activates. evm-tab similarly lazy, deferred
         in Beta 3 since EVM (sidechain) tab is dropped from the visible
         set; the script reference is kept for future re-enable. -->
    <script>
      window.ENM_LAZY_SCRIPTS = window.ENM_LAZY_SCRIPTS || {};
      window.ENM_LAZY_SCRIPTS.auditTab = 'js/components/audit-tab.js?ts=20260520v168';
      window.ENM_LAZY_SCRIPTS.evmTab   = 'js/components/evm-tab.js?ts=20260514a';
    </script>
    <!-- Beta 3 BP-B — settings-drawer.js dropped. Settings now lives in
         the top-level Settings tab (lazy-mounted on first activation).
         The gear icon switches to that tab instead of opening an overlay. -->
    <!-- <script defer src="js/components/settings-drawer.js?ts=20260506g"></script> -->
    <!--   ↑ kept commented for one release as audit-trail; remove in BP-E. -->

    <script defer src="js/components/tools-update-card.js?ts=20260515b3e"></script>
    <!-- beta.3.91 (Wave M2.3) — Multi-chain overview pane. PaneRouter
         (M2.1) mounts this when the chain selector key is 'all'; until
         this script loads PaneRouter renders the M2.1 stub instead. -->
    <script defer src="js/components/multi-chain-overview.js?ts=20260518b391a"></script>
    <!-- v0.5.168 (Phase 2) — SPV Module pane. app.js mounts EnmSpvModule when
         the chain selector key is 'spv' (aggregate arbiter SPV height +
         per-sidechain SPV heights + on-demand logs-spv tail). -->
    <script defer src="js/components/spv-module.js?ts=20260520spv168"></script>
    <!-- BP-E — technical-view.js retired. Beta 3 top-level tabs
         (Dashboard / Logs / Settings / Audit) replaced its 4-sub-tab
         wrapper; the Dashboard pane now mounts SystemStatus + ChainCard
         + BPoS card + ToolsUpdate directly from app.js._showDashboard. -->
    <script defer src="js/app.js?ts=20260520v168"></script>
</body>
</html>

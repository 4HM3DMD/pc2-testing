<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Elastos Node Manager</title>
    <link rel="stylesheet" href="css/styles.css?ts=20260501">
</head>
<body>
    <div id="app" class="enm-app" data-state="connecting">
        <header class="enm-titlebar">
            <h1>Elastos Node Manager</h1>
            <span class="enm-badge" id="enm-version" aria-label="version">v0.2.0</span>
            <div class="enm-spacer"></div>
            <span class="enm-wallet-badge" id="enm-wallet-badge" data-state="disconnected">
                <span class="enm-wallet-dot"></span>
                <span id="enm-wallet-label">Connecting...</span>
            </span>
        </header>

        <nav class="enm-tabs" id="enm-tabs" role="tablist" hidden>
            <button type="button" role="tab" data-tab="dashboard" aria-selected="true">Dashboard</button>
            <button type="button" role="tab" data-tab="logs"      aria-selected="false">Logs</button>
            <button type="button" role="tab" data-tab="settings"  aria-selected="false">Settings</button>
            <button type="button" role="tab" data-tab="audit"     aria-selected="false">Audit</button>
        </nav>

        <main class="enm-main">
            <div class="enm-spinner" id="enm-spinner" role="status" aria-live="polite">
                <div class="enm-spinner-dots">
                    <div class="enm-spinner-dot"></div>
                    <div class="enm-spinner-dot"></div>
                    <div class="enm-spinner-dot"></div>
                </div>
                <p class="enm-spinner-text" id="enm-spinner-text">Connecting to Node Manager...</p>
            </div>

            <section class="enm-content" id="enm-content" hidden>
                <div class="enm-pane" id="enm-pane-dashboard"></div>
                <div class="enm-pane" id="enm-pane-logs" hidden></div>
                <div class="enm-pane" id="enm-pane-settings" hidden></div>
                <div class="enm-pane" id="enm-pane-audit" hidden></div>
            </section>

            <div class="enm-error" id="enm-error" hidden role="alert">
                <div class="enm-error-title" id="enm-error-title"></div>
                <div class="enm-error-detail" id="enm-error-detail"></div>
            </div>
        </main>
    </div>

    <!-- Order matters: strings + utils first (used by services + components),
         then services, then components, then the app controller. -->
    <script src="js/strings.js?ts=20260501"></script>
    <script src="js/utils.js?ts=20260501"></script>
    <script src="js/services/wallet.js?ts=20260501"></script>
    <script src="js/services/api.js?ts=20260501"></script>
    <script src="js/services/sse.js?ts=20260501"></script>
    <script src="js/services/notifications.js?ts=20260501"></script>
    <script src="js/components/system-status.js?ts=20260501"></script>
    <script src="js/components/chain-card.js?ts=20260501"></script>
    <script src="js/components/log-viewer.js?ts=20260501"></script>
    <script src="js/components/proposal-card.js?ts=20260501"></script>
    <script src="js/components/setup-wizard.js?ts=20260501"></script>
    <script src="js/components/settings-tab.js?ts=20260501"></script>
    <script src="js/components/audit-tab.js?ts=20260501"></script>
    <script src="js/app.js?ts=20260501"></script>
</body>
</html>

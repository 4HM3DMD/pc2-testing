<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC2 Media Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="player-root">
    <div id="loading-screen">
      <div class="spinner"></div>
      <p id="loading-text">Initializing...</p>
    </div>

    <div id="error-screen" style="display:none;">
      <h2>Playback Error</h2>
      <p id="error-text"></p>
    </div>

    <div id="player-container" style="display:none;">
      <div id="video-wrapper">
        <video id="video"
          playsinline
          disablepictureinpicture
          controlslist="nodownload noremoteplayback nofullscreen"
        ></video>
        <div id="watermark"></div>
      </div>
      <div id="controls">
        <button id="btn-play" title="Play/Pause">
          <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
        </button>
        <span id="time-current">0:00</span>
        <div id="seek-bar-container">
          <div id="seek-bar-bg"></div>
          <div id="seek-bar-buffered"></div>
          <div id="seek-bar-progress"></div>
          <input type="range" id="seek-bar" min="0" max="100" step="0.1" value="0">
        </div>
        <span id="time-duration">0:00</span>
        <div id="volume-group">
          <button id="btn-mute" title="Mute">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </button>
          <input type="range" id="volume-bar" min="0" max="100" value="80">
        </div>
        <button id="btn-fullscreen" title="Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <script src="player.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC2 Media Player</title>
  <link rel="stylesheet" href="player.css?v=2">
</head>
<body>
  <div id="player-root">
    <div id="loading-screen">
      <div class="spinner"></div>
      <p id="loading-text">Initializing...</p>
    </div>

    <div id="error-screen" style="display:none;">
      <h2 id="error-title">Playback Error</h2>
      <p id="error-text"></p>
    </div>

    <div id="player-container" style="display:none;">
      <div id="video-wrapper">
        <video id="video"
          playsinline
          disablepictureinpicture
          controlslist="nodownload noremoteplayback nofullscreen"
        ></video>
        <div id="watermark"></div>
        <div id="buffering-overlay" style="display:none;">
          <div class="spinner"></div>
        </div>
        <div id="audio-art" style="display:none;">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="#3b82f6" opacity="0.6"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <p id="audio-title"></p>
        </div>
      </div>
      <div id="controls">
        <button id="btn-play" aria-label="Play/Pause" title="Play/Pause (Space)">
          <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
        </button>
        <span id="time-current">0:00</span>
        <div id="seek-bar-container">
          <div id="seek-bar-bg"></div>
          <div id="seek-bar-buffered"></div>
          <div id="seek-bar-progress"></div>
          <input type="range" id="seek-bar" min="0" max="100" step="0.1" value="0" aria-label="Seek">
        </div>
        <span id="time-duration">0:00</span>
        <div id="volume-group">
          <button id="btn-mute" aria-label="Mute" title="Mute (M)">
            <svg id="icon-vol-on" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <svg id="icon-vol-off" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input type="range" id="volume-bar" min="0" max="100" value="80" aria-label="Volume">
        </div>
        <div id="quality-group" style="position:relative;">
          <button id="btn-quality" aria-label="Quality" title="Quality">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
          <div id="quality-menu" style="display:none;"></div>
        </div>
        <button id="btn-fullscreen" aria-label="Fullscreen" title="Fullscreen (F)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <script src="player.js?v=2"></script>
</body>
</html>

[package]
name = "ddrm-renderer"
version = "0.1.0"
edition = "2021"
description = "dDRM Universal Access Layer — decrypt and render protected assets inside WASM sandbox"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ddrm-renderer"
path = "src/main.rs"

[features]
default = [
    "image-render",
    "text-render",
    "pdf-render",
    "code-render",
    "epub-render",
    "cbz-render",
]
image-render = ["dep:image"]
text-render = ["dep:ab_glyph", "dep:imageproc"]
pdf-render = ["dep:hayro", "image-render"]
code-render = ["dep:syntect", "image-render"]
# EPUB reflowable rendering: ZIP extract + streaming XHTML sanitize -> HTML.
epub-render = ["dep:zip", "dep:quick-xml"]
# CBZ comic rendering: ZIP extract + natural sort + watermark -> JPEG.
cbz-render = ["dep:zip", "image-render"]
audio-stream = []
video-stream = []

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Render mode: images
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"], optional = true }

# Render mode: text
ab_glyph = { version = "0.2", optional = true }
imageproc = { version = "0.25", default-features = false, optional = true }

# Render mode: PDF (hayro — pure Rust rasterizer, WASM-native)
hayro = { version = "0.5", default-features = false, features = ["embed-fonts"], optional = true }

# Render mode: Code (syntax highlighting)
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }

# Render mode: EPUB + CBZ (ZIP container)
# `deflate-miniz` keeps the WASM size small (no zlib-ng dep).
zip = { version = "0.6", default-features = false, features = ["deflate-miniz"], optional = true }

# Render mode: EPUB (streaming XHTML parser for sanitization)
quick-xml = { version = "0.36", default-features = false, optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

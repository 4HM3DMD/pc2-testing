[package]
name = "evm-multicall"
version = "0.1.0"
edition = "2021"
description = "Multicall3 ABI encoder/decoder for batching EVM read calls — runs in WASM sandbox"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "evm-multicall"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

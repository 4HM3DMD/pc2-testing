[package]
name = "amm-engine"
version = "0.1.0"
edition = "2021"
description = "Uniswap V2 AMM math engine for local price quotes — runs in WASM sandbox"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "amm-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

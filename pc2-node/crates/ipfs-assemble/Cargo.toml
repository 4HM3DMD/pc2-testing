[package]
name = "ipfs-assemble"
version = "0.1.0"
edition = "2021"
description = "IPFS chunk assembler — concatenates UnixFS chunks in WASM linear memory to reduce V8 GC pressure"
license = "MIT"

[[bin]]
name = "ipfs-assemble"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
